apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dpf-monitoring
  namespace: argocd

spec:

  project: dpf-project

  source:
    repoURL: https://github.com/romain617/devops-platform.git
    targetRevision: main
    path: platform-components/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
