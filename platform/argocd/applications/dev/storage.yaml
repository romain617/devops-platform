apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:

  name: dpf-storage

  namespace: argocd


spec:


  project: dpf-project


  source:

    repoURL: https://github.com/romain617/devops-platform.git

    targetRevision: main

    path: platform-components/storage



  destination:

    server: https://kubernetes.default.svc

    namespace: local-path-storage



  syncPolicy:

    automated:

      prune: true

      selfHeal: true


    syncOptions:

    - CreateNamespace=true

