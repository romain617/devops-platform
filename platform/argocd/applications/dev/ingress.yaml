apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dpf-ingress
  namespace: argocd
spec:
  project: dpf-project

  source:
    repoURL: https://github.com/romain617/devops-platform.git
    targetRevision: main
    path: platform-components/ingress

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true
