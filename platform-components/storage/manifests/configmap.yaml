apiVersion: v1
kind: ConfigMap

metadata:
  name: local-path-config
  namespace: local-path-storage

data:

  config.json: |
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": [
            "/opt/local-path-provisioner"
          ]
        }
      ]
    }

  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: busybox
        command:
        - /bin/sh
        - -c
        - sleep 3600
